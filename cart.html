
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store - Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <div class="header">
        <h1>Shopping App</h1>
        <div class="header-links">
            <a href="index.html">Home</a>
            <a href="orders.html">Orders</a>
            <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
        </div>
    </div>

    <main class="cart-container">
        <h2 class="page-heading">Shopping Cart</h2>

        <div class="cart-layout">
            <div class="cart-items" id="cart-items" aria-live="polite"></div>

            <aside class="cart-summary">
                <h3>Order Summary</h3>

                <div class="summary-row">
                    <span>Items:</span>
                    <span id="summary-count">0</span>
                </div>

                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="summary-subtotal">₹0.00</span>
                </div>

                <div class="summary-row">
                    <span>Delivery:</span>
                    <span>FREE</span>
                </div>

                <div class="summary-row">
                    <span>Tax (10%):</span>
                    <span id="summary-tax">₹0.00</span>
                </div>

                <hr>

                <div class="summary-total">
                    <span>Order Total:</span>
                    <span id="summary-total">₹0.00</span>
                </div>

                <a class="checkout-button checkout-link" href="checkout.html">
                    Proceed to Checkout
                </a>
            </aside>
        </div>
    </main>

    <p id="cart-status" class="form-status" role="status" aria-live="polite"></p>

    <div class="footer">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <p style="margin: 10px 0 0 0; font-size: 14px;">
            &copy; 2026 My Store. All rights reserved.
        </p>
    </div>

    <script src="js/app.js" defer></script>
</body>
</html>
